<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&display=swap">
<style>
  :root{
    --ink:#17181c; --muted:#6b6f7a; --faint:#a3a7b0;
    --bg:#ffffff; --tint:#eef3ff; --tint2:#f6f7fb;
    --line:#e9ebf0;
    --accent: oklch(56% 0.19 265); --accent-2: oklch(56% 0.19 265 / 0.10);
    --err: oklch(58% 0.18 25); --err-soft: oklch(58% 0.18 25 / 0.10);
  }
  .wf-root{ width:1200px; height:800px; background:var(--bg); color:var(--ink);
    font-family:'Gothic A1',sans-serif; overflow:hidden; display:flex; }
  .wf-num{ font-variant-numeric:tabular-nums; }
  .wf-nav{ display:flex; align-items:center; gap:11px; padding:10px 14px; margin:0 12px; border-radius:14px; font-size:14px; font-weight:500; color:var(--muted); }
  .wf-nav.active{ background:var(--tint); color:var(--accent); font-weight:700; }
  .wf-nav.sub{ padding-left:38px; font-size:13px; }
  .card{ background:var(--tint2); border-radius:20px; padding:20px; }
  .chip{ display:inline-flex; align-items:center; padding:5px 12px; border-radius:99px; font-size:12px; font-weight:700; white-space:nowrap; }
  .btn{ display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:99px; font-size:12.5px; font-weight:700; }
  .btn-ghost{ background:var(--tint2); color:var(--ink); }
  .btn-danger{ background:var(--err-soft); color:var(--err); }
  .col-label{ font-size:11px; font-weight:700; color:var(--faint); letter-spacing:.02em; }
  .thumb{ width:56px; height:56px; border-radius:10px; background:var(--tint); flex:none; }
</style>
</helmet>

<div class="wf-root">

  <div style="width:208px; flex:none; padding:24px 0; display:flex; flex-direction:column;">
    <div style="font-size:16px; font-weight:900; padding:0 26px; margin-bottom:22px;">주방설비 매니저</div>
    <div class="wf-nav">대시보드</div>
    <div class="wf-nav">영수증</div>
    <div class="wf-nav">세금계산서</div>
    <div class="wf-nav sub" style="color:var(--faint);">거래처</div>
    <div class="wf-nav">도면</div>
    <div class="wf-nav active">제품 카탈로그</div>
    <div style="flex:1;"></div>
    <div class="wf-nav">직원 관리</div>
    <div class="wf-nav">플랜·결제</div>
  </div>

  <div style="flex:1; min-width:0; padding:26px 34px 26px; display:flex; flex-direction:column; gap:16px; overflow:hidden;">

    <div style="display:flex; align-items:center; gap:12px; font-size:12.5px; color:var(--faint); font-weight:600;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      제품 카탈로그
    </div>

    <div style="display:flex; align-items:baseline; justify-content:space-between;">
      <div style="font-size:21px; font-weight:900;">업소용 스텐 냄비</div>
      <div style="display:flex; gap:8px;">
        <div class="btn btn-ghost">QR 인쇄</div>
        <div class="btn btn-ghost">수정</div>
        <div class="btn btn-danger">삭제</div>
      </div>
    </div>

    <div style="flex:1; min-height:0; display:flex; gap:20px;">

      <!-- gallery -->
      <div style="width:340px; flex:none; display:flex; flex-direction:column; gap:10px;">
        <div class="card" style="height:260px; display:flex; align-items:center; justify-content:center; padding:0;">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="1.2"><circle cx="12" cy="12" r="9"></circle><path d="M8 12h8M12 8v8"></path></svg>
        </div>
        <div style="display:flex; gap:8px;">
          <div class="thumb"></div>
          <div class="thumb"></div>
          <div class="thumb"></div>
        </div>
      </div>

      <!-- info -->
      <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:14px; overflow:hidden;">

        <div style="display:flex; gap:14px;">
          <div class="card" style="flex:1;">
            <div class="col-label">분류</div>
            <div style="font-size:13.5px; font-weight:700; margin-top:6px;">조리도구 › 냄비 › 스텐냄비</div>
          </div>
          <div class="card" style="flex:1;">
            <div class="col-label">재질</div>
            <div style="font-size:13.5px; font-weight:700; margin-top:6px;">스테인리스</div>
          </div>
        </div>

        <div class="card">
          <div class="col-label">용도 설명</div>
          <div style="font-size:13px; line-height:1.6; margin-top:8px;">대량 조리용. 직화·인덕션 겸용 사용 가능.</div>
          <div style="height:1px; background:var(--line); margin:12px 0;"></div>
          <div class="col-label">특이사항</div>
          <div style="font-size:13px; line-height:1.6; margin-top:8px; color:var(--muted);">뚜껑 별매 — 별도 SKU 없음, 문의 시 안내</div>
        </div>

        <!-- sku table -->
        <div style="flex:1; min-height:0; display:flex; flex-direction:column;">
          <div style="display:flex; align-items:center; gap:14px; padding:0 16px 6px;">
            <div class="col-label" style="width:64px;">사이즈</div>
            <div class="col-label" style="width:120px; text-align:center;">단가</div>
            <div class="col-label" style="flex:1;">바코드 / QR</div>
            <div class="col-label" style="width:90px; text-align:right;">단가 이력</div>
          </div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            <div style="display:flex; align-items:center; gap:14px; padding:10px 16px; border-radius:14px; background:var(--tint2);">
              <div style="width:64px;"><span class="chip" style="background:var(--tint); color:var(--accent); padding:3px 10px; font-size:11px;">S</span></div>
              <div class="wf-num" style="width:120px; text-align:center; font-size:13px; font-weight:700;">₩28,000</div>
              <div class="wf-num" style="flex:1; font-size:12px; color:var(--muted);">8801234560001</div>
              <div style="width:90px; text-align:right; font-size:11.5px; color:var(--accent); font-weight:600;">보기</div>
            </div>
            <div style="display:flex; align-items:center; gap:14px; padding:10px 16px; border-radius:14px;">
              <div style="width:64px;"><span class="chip" style="background:var(--tint); color:var(--accent); padding:3px 10px; font-size:11px;">M</span></div>
              <div class="wf-num" style="width:120px; text-align:center; font-size:13px; font-weight:700;">₩35,000</div>
              <div class="wf-num" style="flex:1; font-size:12px; color:var(--muted);">8801234560002</div>
              <div style="width:90px; text-align:right; font-size:11.5px; color:var(--accent); font-weight:600;">보기</div>
            </div>
            <div style="display:flex; align-items:center; gap:14px; padding:10px 16px; border-radius:14px; background:var(--tint2);">
              <div style="width:64px;"><span class="chip" style="background:var(--tint); color:var(--accent); padding:3px 10px; font-size:11px;">L</span></div>
              <div class="wf-num" style="width:120px; text-align:center; font-size:13px; font-weight:700;">₩42,000</div>
              <div class="wf-num" style="flex:1; font-size:12px; color:var(--muted);">8801234560003</div>
              <div style="width:90px; text-align:right; font-size:11.5px; color:var(--accent); font-weight:600;">보기</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
