<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Mobile Receipt preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    background: 'var(--background)', foreground: 'var(--foreground)',
    card: 'var(--card)', primary: 'var(--primary)', 'primary-foreground': 'var(--primary-foreground)',
    secondary: 'var(--secondary)', 'secondary-foreground': 'var(--secondary-foreground)',
    'muted-foreground': 'var(--muted-foreground)', border: 'var(--border)',
  } } } }
</script>
<style>
  :root { --background:#FFFFFF; --foreground:#1F2328; --card:#FFFFFF; --primary:#0969DA; --primary-foreground:#FFFFFF;
    --secondary:#F6F8FA; --secondary-foreground:#33414E; --muted-foreground:#59636E; --border:#D1D9E0; --success:#1A7F37; }
  body{font-family:-apple-system,BlinkMacSystemFont,'Pretendard',system-ui,Roboto,sans-serif;}
  .font-mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
</style>
</head>
<body>
<!-- High-contrast field mode (default ON): pure black/white, not a color choice — a confirmed product requirement for outdoor legibility -->
<div class="min-h-screen flex flex-col bg-black text-white" style="max-width:390px;margin:0 auto;">
  <header class="p-3 flex items-center justify-between sticky top-0 z-30 border-b-2 bg-black border-white">
    <div class="flex items-center gap-2 p-2 -ml-2">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 2L4 8l6 6"/></svg>
      <span class="text-sm font-bold">사무소 콘솔 복귀</span>
    </div>
    <div class="flex items-center gap-2">
      <button class="p-2.5 rounded border-2 bg-black text-white border-white"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 1v6l-3 8h6l-3-8V1z"/></svg></button>
      <button class="p-2.5 rounded border-2 bg-white text-black border-white"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2"/></svg></button>
    </div>
  </header>
  <div class="px-4 py-2 flex items-center justify-between text-xs border-b border-white/30">
    <span class="font-bold flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-white"></span>현장 모바일 전용 (터치 타겟 48px 이상 · 고대비)</span>
    <span class="text-[11px] text-white/70">작업자: 현장 최기사</span>
  </div>
  <main class="flex-1 p-4 flex flex-col justify-between w-full space-y-4">
    <!-- OCR review step (post-capture state) -->
    <div class="flex-1 flex flex-col justify-between space-y-4">
      <div class="p-3 rounded border-2 border-white bg-black flex items-center gap-3">
        <svg width="28" height="28" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="7"/><path d="M5 8l2 2 4-4"/></svg>
        <div><p class="font-extrabold text-sm">자동인식 완료 (신뢰도 99.4%)</p><p class="text-xs text-white/70">현장 조명 보정 및 금액 자동 추출됨</p></div>
      </div>
      <div class="space-y-3.5 p-4 rounded border-2 border-white bg-black">
        <div>
          <label class="text-xs font-bold block mb-1">결제 금액 (원) — 현장 검증</label>
          <div class="relative"><input class="w-full h-14 text-2xl font-black px-3 rounded font-mono border-2 bg-black border-white text-white" value="148,500"><span class="absolute right-3 top-4 text-base font-bold">원</span></div>
        </div>
        <div>
          <label class="text-xs font-bold block mb-1">가맹점 / 부속상사명</label>
          <input class="w-full h-12 text-base font-bold px-3 rounded border bg-black border-white text-white" value="동양스텐 부속상사">
        </div>
        <div>
          <label class="text-xs font-bold block mb-1.5">지출 카테고리 (즉시 터치 선택)</label>
          <div class="grid grid-cols-1 gap-2">
            <button class="h-11 px-3 text-left font-bold text-xs flex items-center justify-between rounded border-2 bg-white text-black border-white">
              <span>현장부자재 (배관/피팅)</span><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="3"><path d="M3 8l3 4 7-9"/></svg>
            </button>
            <button class="h-11 px-3 text-left font-bold text-xs flex items-center rounded border-2 bg-black text-white border-white/40">시공외주 (크레인/인양)</button>
            <button class="h-11 px-3 text-left font-bold text-xs flex items-center rounded border-2 bg-black text-white border-white/40">차량유류비 (포터주유)</button>
          </div>
        </div>
      </div>
      <div class="space-y-2 pt-2">
        <button class="w-full h-16 font-black text-lg flex items-center justify-center gap-2 rounded text-white" style="background:var(--success)">
          <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="3"><path d="M3 8l4 4 6-8"/></svg>
          <span>사무소로 즉시 전송하기</span>
        </button>
        <button class="w-full h-11 font-bold text-xs flex items-center justify-center gap-2 rounded border-2 bg-black text-white border-white/40">다시 촬영하기</button>
      </div>
    </div>
  </main>
</div>
</body>
</html>
