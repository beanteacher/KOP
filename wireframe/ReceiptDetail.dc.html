<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&display=swap">
<style>
  :root{
    --ink:#17181c; --muted:#6b6f7a; --faint:#a3a7b0;
    --bg:#ffffff; --tint:#eef3ff; --tint2:#f6f7fb;
    --line:#e9ebf0;
    --accent: oklch(56% 0.19 265); --accent-2: oklch(56% 0.19 265 / 0.10);
    --err: oklch(58% 0.18 25); --err-soft: oklch(58% 0.18 25 / 0.10);
  }
  .wf-root{ width:1200px; height:800px; background:var(--bg); color:var(--ink);
    font-family:'Gothic A1',sans-serif; overflow:hidden; display:flex; }
  .wf-num{ font-variant-numeric:tabular-nums; }
  .wf-nav{ display:flex; align-items:center; gap:11px; padding:10px 14px; margin:0 12px; border-radius:14px; font-size:14px; font-weight:500; color:var(--muted); }
  .wf-nav.active{ background:var(--tint); color:var(--accent); font-weight:700; }
  .wf-nav.sub{ padding-left:38px; font-size:13px; }
  .card{ background:var(--tint2); border-radius:20px; padding:20px; }
  .chip{ display:inline-flex; align-items:center; padding:5px 12px; border-radius:99px; font-size:12px; font-weight:700; white-space:nowrap; }
  .btn{ display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:99px; font-size:12.5px; font-weight:700; }
  .btn-ghost{ background:var(--tint2); color:var(--ink); }
  .btn-danger{ background:var(--err-soft); color:var(--err); }
  .row{ display:flex; align-items:baseline; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); }
  .row:last-child{ border-bottom:none; }
  .lbl{ font-size:12.5px; color:var(--muted); font-weight:600; }
  .val{ font-size:13.5px; font-weight:700; }
</style>
</helmet>

<div class="wf-root">

  <div style="width:208px; flex:none; padding:24px 0; display:flex; flex-direction:column;">
    <div style="font-size:16px; font-weight:900; padding:0 26px; margin-bottom:22px;">주방설비 매니저</div>
    <div class="wf-nav">대시보드</div>
    <div class="wf-nav active">영수증</div>
    <div class="wf-nav">세금계산서</div>
    <div class="wf-nav sub" style="color:var(--faint);">거래처</div>
    <div class="wf-nav">도면</div>
    <div class="wf-nav">제품 카탈로그</div>
    <div style="flex:1;"></div>
    <div class="wf-nav">직원 관리</div>
    <div class="wf-nav">플랜·결제</div>
  </div>

  <div style="flex:1; min-width:0; padding:26px 34px 26px; display:flex; flex-direction:column; gap:16px; overflow:hidden;">

    <div style="display:flex; align-items:center; gap:12px; font-size:12.5px; color:var(--faint); font-weight:600;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      영수증 목록
    </div>

    <div style="display:flex; align-items:baseline; justify-content:space-between;">
      <div style="font-size:21px; font-weight:900;">한성식자재</div>
      <div style="display:flex; gap:8px;">
        <div class="btn btn-ghost">수정</div>
        <div class="btn btn-danger">삭제</div>
      </div>
    </div>

    <div style="flex:1; min-height:0; display:flex; gap:20px;">

      <!-- image -->
      <div class="card" style="flex:1; display:flex; align-items:center; justify-content:center; background:var(--tint2); position:relative;">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="1.2"><path d="M6 3h12v18l-2.5-1.5L13 21l-1.5-1.5L10 21l-2.5-1.5L6 21z"></path><path d="M9 8h6M9 12h6M9 16h3"></path></svg>
        <div class="chip" style="position:absolute; top:14px; left:14px; background:#fff; color:var(--muted); box-shadow:0 2px 8px rgba(0,0,0,.06);">영수증 원본</div>
      </div>

      <!-- info panel -->
      <div style="width:340px; flex:none; display:flex; flex-direction:column; gap:14px;">
        <div class="card">
          <div class="lbl">금액</div>
          <div class="wf-num" style="font-size:30px; font-weight:900; margin-top:6px;">₩85,000</div>
          <div style="margin-top:10px;"><span class="chip" style="background:var(--tint); color:var(--accent); padding:3px 10px; font-size:11px;">재료비</span></div>
        </div>

        <div class="card">
          <div class="row"><div class="lbl">거래처</div><div class="val">한성식자재</div></div>
          <div class="row"><div class="lbl">등록일</div><div class="val wf-num">2026.09.10</div></div>
          <div class="row"><div class="lbl">등록자</div><div class="val">김대표</div></div>
          <div class="row"><div class="lbl">연결 거래처</div><div class="val" style="color:var(--faint); font-weight:600;">미지정</div></div>
        </div>

        <div class="card">
          <div class="lbl" style="margin-bottom:8px;">메모</div>
          <div style="font-size:13px; line-height:1.6; color:var(--ink);">9월 재료비 — 육류·채소 일괄 구매</div>
        </div>

        <div style="display:flex; align-items:center; gap:8px; padding:11px 14px; border-radius:14px; background:var(--tint);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
          <div style="font-size:11.5px; color:var(--accent); font-weight:600; line-height:1.4;">등록 후 24시간 이내에만 직접 수정할 수 있어요</div>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
