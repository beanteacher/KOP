<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&display=swap">
<style>
  :root{
    --ink:#17181c; --muted:#6b6f7a; --faint:#a3a7b0;
    --bg:#ffffff; --tint:#eef3ff; --tint2:#f6f7fb;
    --line:#e9ebf0;
    --accent: oklch(56% 0.19 265); --accent-2: oklch(56% 0.19 265 / 0.10);
    --pos: oklch(62% 0.15 155); --pos-soft: oklch(62% 0.15 155 / 0.12);
  }
  .wf-root{ width:1200px; height:800px; background:var(--bg); color:var(--ink);
    font-family:'Gothic A1',sans-serif; overflow:hidden; display:flex; }
  .wf-num{ font-variant-numeric:tabular-nums; }
  .wf-nav{ display:flex; align-items:center; gap:11px; padding:10px 14px; margin:0 12px; border-radius:14px; font-size:14px; font-weight:500; color:var(--muted); }
  .wf-nav.active{ background:var(--tint); color:var(--accent); font-weight:700; }
  .wf-nav.sub{ padding-left:38px; font-size:13px; }
  .chip{ display:inline-flex; align-items:center; padding:5px 12px; border-radius:99px; font-size:12px; font-weight:700; white-space:nowrap; }
  .field{ display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:99px; background:var(--tint2); font-size:12.5px; font-weight:600; color:var(--muted); }
  .btn-primary{ display:inline-flex; align-items:center; gap:7px; padding:10px 18px; border-radius:99px; background:var(--accent); color:#fff; font-size:13px; font-weight:800; }
  .dcard{ background:var(--tint2); border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .thumb{ height:112px; border-radius:12px; background:var(--tint); display:flex; align-items:center; justify-content:center; }
</style>
</helmet>

<div class="wf-root">

  <div style="width:208px; flex:none; padding:24px 0; display:flex; flex-direction:column;">
    <div style="font-size:16px; font-weight:900; padding:0 26px; margin-bottom:22px;">주방설비 매니저</div>
    <div class="wf-nav">대시보드</div>
    <div class="wf-nav">영수증</div>
    <div class="wf-nav">세금계산서</div>
    <div class="wf-nav sub" style="color:var(--faint);">거래처</div>
    <div class="wf-nav active">도면</div>
    <div class="wf-nav">제품 카탈로그</div>
    <div style="flex:1;"></div>
    <div class="wf-nav">직원 관리</div>
    <div class="wf-nav">플랜·결제</div>
  </div>

  <div style="flex:1; min-width:0; padding:26px 34px 26px; display:flex; flex-direction:column; gap:16px; overflow:hidden;">

    <div style="display:flex; align-items:baseline; justify-content:space-between;">
      <div>
        <div style="font-size:21px; font-weight:900;">도면</div>
        <div style="font-size:12px; color:var(--muted); font-weight:600; margin-top:2px;">Pro 플랜 · 3 / 5개 사용 중</div>
      </div>
      <div class="btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        새 도면
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:9px;">
      <div class="field" style="flex:1; max-width:300px; color:var(--faint);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.2 15.2l4.5 4.5"></path></svg>
        도면·고객명 검색
      </div>
      <div class="field">최근 수정순</div>
    </div>

    <div style="flex:1; min-height:0; display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:16px; overflow:hidden; align-content:start;">

      <div class="dcard">
        <div class="thumb">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.3"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"></rect><path d="M3.5 9h17M9 3.5v17"></path></svg>
        </div>
        <div>
          <div style="font-size:13.5px; font-weight:700;">OO식당 주방 배치도</div>
          <div style="font-size:11.5px; color:var(--muted); margin-top:2px;">OO식당 · 서울 강남구</div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span class="chip" style="background:var(--pos-soft); color:var(--pos);">공유중</span>
          <div class="wf-num" style="font-size:11px; color:var(--faint);">09.11 수정 · v4</div>
        </div>
      </div>

      <div class="dcard">
        <div class="thumb">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.3"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"></rect><path d="M3.5 9h17M9 3.5v17"></path></svg>
        </div>
        <div>
          <div style="font-size:13.5px; font-weight:700;">△△카페 배치도</div>
          <div style="font-size:11.5px; color:var(--muted); margin-top:2px;">△△카페 · 경기 성남시</div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span class="chip" style="background:#eef0f4; color:var(--muted);">비공개</span>
          <div class="wf-num" style="font-size:11px; color:var(--faint);">09.08 수정 · v2</div>
        </div>
      </div>

      <div class="dcard">
        <div class="thumb">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.3"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"></rect><path d="M3.5 9h17M9 3.5v17"></path></svg>
        </div>
        <div>
          <div style="font-size:13.5px; font-weight:700;">청춘삼겹살 홀 배치도</div>
          <div style="font-size:11.5px; color:var(--muted); margin-top:2px;">청춘삼겹살 · 서울 마포구</div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span class="chip" style="background:#eef0f4; color:var(--muted);">비공개</span>
          <div class="wf-num" style="font-size:11px; color:var(--faint);">09.02 수정 · v1</div>
        </div>
      </div>

      <div class="dcard" style="align-items:center; justify-content:center; border:1.5px dashed var(--line); background:transparent; min-height:150px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="1.8"><path d="M12 5v14M5 12h14"></path></svg>
        <div style="font-size:12.5px; color:var(--faint); font-weight:600; margin-top:6px;">새 도면 만들기</div>
      </div>

    </div>

  </div>
</div>
</x-dc>
</body>
</html>
