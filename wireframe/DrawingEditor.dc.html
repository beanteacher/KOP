<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&display=swap">
<style>
  :root{
    --ink:#17181c; --muted:#6b6f7a; --faint:#a3a7b0;
    --bg:#ffffff; --tint:#eef3ff; --tint2:#f6f7fb;
    --line:#e9ebf0;
    --accent: oklch(56% 0.19 265); --accent-2: oklch(56% 0.19 265 / 0.10);
    --canvas-bg:#fbfbfc;
  }
  .wf-root{ width:1200px; height:800px; background:var(--bg); color:var(--ink);
    font-family:'Gothic A1',sans-serif; overflow:hidden; display:flex; flex-direction:column; }
  .wf-num{ font-variant-numeric:tabular-nums; }
  .chip{ display:inline-flex; align-items:center; padding:5px 12px; border-radius:99px; font-size:12px; font-weight:700; white-space:nowrap; }
  .field{ display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:99px; background:var(--tint2); font-size:12px; font-weight:600; color:var(--muted); }
  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:99px; font-size:12.5px; font-weight:700; }
  .btn-ghost{ background:var(--tint2); color:var(--ink); }
  .btn-primary{ background:var(--accent); color:#fff; }
  .iconbtn{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--tint2); flex:none; }
  .cat{ padding:6px 12px; border-radius:99px; font-size:11.5px; font-weight:700; color:var(--muted); }
  .cat.active{ background:var(--tint); color:var(--accent); }
  .sym{ display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:12px; }
  .sym:hover{ background:var(--tint2); }
  .symicon{ width:30px; height:30px; border-radius:8px; background:var(--tint2); display:flex; align-items:center; justify-content:center; flex:none; }
  .lbl{ font-size:11px; font-weight:700; color:var(--faint); letter-spacing:.02em; }
</style>
</helmet>

<div class="wf-root">

  <!-- top bar -->
  <div style="flex:none; display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:1px solid var(--line);">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    <div>
      <div style="font-size:14.5px; font-weight:800;">OO식당 주방 배치도</div>
      <div style="font-size:10.5px; color:var(--faint); font-weight:600; margin-top:1px;">자동 저장됨 · 방금 전 · v4</div>
    </div>
    <div style="flex:1;"></div>
    <div class="iconbtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 5 5v1"></path></svg></div>
    <div class="iconbtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"></path><path d="M20 9H9a5 5 0 0 0-5 5v1"></path></svg></div>
    <div class="field">100%</div>
    <div style="width:1px; height:18px; background:var(--line);"></div>
    <div class="btn btn-ghost">공유</div>
    <div class="btn btn-ghost">PDF 내보내기</div>
    <div class="btn btn-primary">저장</div>
  </div>

  <div style="flex:1; display:flex; min-height:0;">

    <!-- symbol palette -->
    <div style="width:210px; flex:none; border-right:1px solid var(--line); display:flex; flex-direction:column; padding:14px 0;">
      <div style="padding:0 14px 10px;">
        <div class="field" style="width:100%; box-sizing:border-box; color:var(--faint);">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.2 15.2l4.5 4.5"></path></svg>
          심볼 검색
        </div>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 12px;">
        <div class="cat active">가열 기구</div>
        <div class="cat">냉장·냉동</div>
        <div class="cat">세척</div>
        <div class="cat">환기</div>
        <div class="cat">작업대</div>
        <div class="cat">기타</div>
      </div>
      <div style="height:1px; background:var(--line); margin:0 14px 10px;"></div>
      <div style="display:flex; flex-direction:column; gap:2px; padding:0 8px; overflow:hidden;">
        <div class="sym">
          <div class="symicon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"></rect><circle cx="8.5" cy="8.5" r="1.6"></circle><circle cx="15.5" cy="8.5" r="1.6"></circle><circle cx="8.5" cy="15.5" r="1.6"></circle><circle cx="15.5" cy="15.5" r="1.6"></circle></svg></div>
          <div style="font-size:12.5px; font-weight:600;">가스레인지 4구</div>
        </div>
        <div class="sym">
          <div class="symicon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"></rect><circle cx="12" cy="8.5" r="1.6"></circle><circle cx="8.5" cy="15.5" r="1.6"></circle><circle cx="15.5" cy="15.5" r="1.6"></circle></svg></div>
          <div style="font-size:12.5px; font-weight:600; color:var(--muted);">가스레인지 2구</div>
        </div>
        <div class="sym">
          <div class="symicon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"></rect><path d="M3.5 12h17"></path></svg></div>
          <div style="font-size:12.5px; font-weight:600; color:var(--muted);">인덕션</div>
        </div>
        <div class="sym">
          <div class="symicon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"></rect><path d="M8 3.5v17"></path></svg></div>
          <div style="font-size:12.5px; font-weight:600; color:var(--muted);">튀김기</div>
        </div>
        <div class="sym">
          <div class="symicon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"></rect><path d="M3.5 9h17M3.5 15h17"></path></svg></div>
          <div style="font-size:12.5px; font-weight:600; color:var(--muted);">그리들</div>
        </div>
      </div>
    </div>

    <!-- canvas -->
    <div style="flex:1; min-width:0; position:relative; background:
        linear-gradient(var(--line) 1px, transparent 1px) 0 0/24px 24px,
        linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/24px 24px,
        var(--canvas-bg); overflow:hidden;">

      <!-- wall outline -->
      <div style="position:absolute; left:60px; top:40px; right:60px; bottom:40px; border:2px solid var(--ink);"></div>
      <div style="position:absolute; left:60px; top:210px; width:2px; height:120px; background:var(--bg);"></div>
      <!-- door swing symbol -->
      <svg style="position:absolute; left:60px; top:210px; overflow:visible;" width="100" height="120" viewBox="0 0 100 120">
        <path d="M2 2 L92 2 A90 90 0 0 1 2 92" fill="none" stroke="var(--faint)" stroke-width="1.3"></path>
        <line x1="2" y1="2" x2="92" y2="2" stroke="var(--ink)" stroke-width="2"></line>
      </svg>

      <!-- 가스레인지 4구 — top-down burner icon fills the box -->
      <div style="position:absolute; left:110px; top:90px; width:120px; height:64px; background:#fff; border:1.5px solid var(--muted); border-radius:6px;">
        <svg width="100%" height="100%" viewBox="0 0 120 64">
          <circle cx="36" cy="20" r="13" fill="none" stroke="var(--muted)" stroke-width="1.6"></circle>
          <circle cx="36" cy="20" r="3" fill="var(--muted)"></circle>
          <circle cx="84" cy="20" r="13" fill="none" stroke="var(--muted)" stroke-width="1.6"></circle>
          <circle cx="84" cy="20" r="3" fill="var(--muted)"></circle>
          <circle cx="36" cy="44" r="13" fill="none" stroke="var(--muted)" stroke-width="1.6"></circle>
          <circle cx="36" cy="44" r="3" fill="var(--muted)"></circle>
          <circle cx="84" cy="44" r="13" fill="none" stroke="var(--muted)" stroke-width="1.6"></circle>
          <circle cx="84" cy="44" r="3" fill="var(--muted)"></circle>
        </svg>
      </div>

      <!-- 냉장고 — two-door fridge top-down icon -->
      <div style="position:absolute; left:110px; top:190px; width:80px; height:120px; background:#fff; border:1.5px solid var(--muted); border-radius:6px;">
        <svg width="100%" height="100%" viewBox="0 0 80 120">
          <line x1="40" y1="4" x2="40" y2="116" stroke="var(--muted)" stroke-width="1.6"></line>
          <rect x="14" y="10" width="8" height="4" rx="1.5" fill="var(--muted)"></rect>
          <rect x="58" y="10" width="8" height="4" rx="1.5" fill="var(--muted)"></rect>
          <rect x="14" y="60" width="8" height="4" rx="1.5" fill="var(--muted)"></rect>
          <rect x="58" y="60" width="8" height="4" rx="1.5" fill="var(--muted)"></rect>
        </svg>
      </div>

      <!-- 싱크대 2조 — twin basin + faucet icon -->
      <div style="position:absolute; right:90px; top:90px; width:150px; height:70px; background:#fff; border:1.5px solid var(--muted); border-radius:6px;">
        <svg width="100%" height="100%" viewBox="0 0 150 70">
          <circle cx="75" cy="9" r="3.5" fill="none" stroke="var(--muted)" stroke-width="1.6"></circle>
          <line x1="75" y1="12.5" x2="75" y2="20" stroke="var(--muted)" stroke-width="1.6"></line>
          <rect x="16" y="20" width="52" height="40" rx="8" fill="none" stroke="var(--muted)" stroke-width="1.6"></rect>
          <circle cx="42" cy="40" r="4" fill="none" stroke="var(--muted)" stroke-width="1.3"></circle>
          <rect x="82" y="20" width="52" height="40" rx="8" fill="none" stroke="var(--muted)" stroke-width="1.6"></rect>
          <circle cx="108" cy="40" r="4" fill="none" stroke="var(--muted)" stroke-width="1.3"></circle>
        </svg>
      </div>

      <!-- selected: 작업대 120 — furniture corner-bracket icon, accent because selected -->
      <div style="position:absolute; left:340px; top:280px; width:170px; height:70px; background:var(--tint);">
        <svg width="100%" height="100%" viewBox="0 0 170 70">
          <rect x="1" y="1" width="168" height="68" rx="6" fill="none" stroke="var(--accent)" stroke-width="1.5"></rect>
          <path d="M14 14h14M14 14v14" fill="none" stroke="var(--accent)" stroke-width="1.4"></path>
          <path d="M156 14h-14M156 14v14" fill="none" stroke="var(--accent)" stroke-width="1.4"></path>
          <path d="M14 56h14M14 56v-14" fill="none" stroke="var(--accent)" stroke-width="1.4"></path>
          <path d="M156 56h-14M156 56v-14" fill="none" stroke="var(--accent)" stroke-width="1.4"></path>
        </svg>
        <div style="position:absolute; right:8px; bottom:5px; font-size:9px; font-weight:800; color:var(--accent);">120</div>
        <div style="position:absolute; width:8px; height:8px; background:#fff; border:1.5px solid var(--accent); border-radius:2px; left:-5px; top:-5px;"></div>
        <div style="position:absolute; width:8px; height:8px; background:#fff; border:1.5px solid var(--accent); border-radius:2px; right:-5px; top:-5px;"></div>
        <div style="position:absolute; width:8px; height:8px; background:#fff; border:1.5px solid var(--accent); border-radius:2px; left:-5px; bottom:-5px;"></div>
        <div style="position:absolute; width:8px; height:8px; background:#fff; border:1.5px solid var(--accent); border-radius:2px; right:-5px; bottom:-5px;"></div>
        <div style="position:absolute; width:8px; height:8px; background:var(--accent); border-radius:99px; left:50%; top:-24px; transform:translateX(-50%);"></div>
        <div style="position:absolute; width:1px; height:16px; background:var(--accent); left:50%; top:-16px;"></div>
      </div>

      <!-- 벽부형 후드 — hood + fan icon -->
      <div style="position:absolute; right:120px; bottom:70px; width:130px; height:70px; background:#fff; border:1.5px solid var(--muted); border-radius:6px;">
        <svg width="100%" height="100%" viewBox="0 0 130 70">
          <path d="M20 8h90l-18 54H38z" fill="none" stroke="var(--muted)" stroke-width="1.6"></path>
          <circle cx="65" cy="34" r="12" fill="none" stroke="var(--muted)" stroke-width="1.4"></circle>
          <path d="M65 24v20M55 34h20M58 27l14 14M72 27l-14 14" stroke="var(--muted)" stroke-width="1.1"></path>
        </svg>
      </div>

      <!-- zoom control bottom-left -->
      <div style="position:absolute; left:20px; bottom:20px; display:flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line); border-radius:99px; padding:6px 8px;">
        <div class="iconbtn" style="width:24px; height:24px; background:var(--tint2);">−</div>
        <div class="wf-num" style="font-size:11.5px; font-weight:700; width:34px; text-align:center;">100%</div>
        <div class="iconbtn" style="width:24px; height:24px; background:var(--tint2);">+</div>
      </div>
    </div>

    <!-- properties panel -->
    <div style="width:250px; flex:none; border-left:1px solid var(--line); padding:16px 16px; display:flex; flex-direction:column; gap:16px; overflow:hidden;">
      <div>
        <div class="lbl">선택된 오브젝트</div>
        <div style="font-size:14px; font-weight:800; margin-top:6px;">작업대 (폭 120cm)</div>
      </div>

      <div style="display:flex; flex-direction:column; gap:8px;">
        <div style="display:flex; gap:8px;">
          <div style="flex:1;">
            <div class="lbl">X (cm)</div>
            <div class="field" style="width:100%; box-sizing:border-box; margin-top:5px; justify-content:center;">210</div>
          </div>
          <div style="flex:1;">
            <div class="lbl">Y (cm)</div>
            <div class="field" style="width:100%; box-sizing:border-box; margin-top:5px; justify-content:center;">340</div>
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <div style="flex:1;">
            <div class="lbl">폭 (cm)</div>
            <div class="field" style="width:100%; box-sizing:border-box; margin-top:5px; justify-content:center;">120</div>
          </div>
          <div style="flex:1;">
            <div class="lbl">높이 (cm)</div>
            <div class="field" style="width:100%; box-sizing:border-box; margin-top:5px; justify-content:center;">60</div>
          </div>
        </div>
        <div>
          <div class="lbl">회전 (°)</div>
          <div class="field" style="width:100%; box-sizing:border-box; margin-top:5px; justify-content:center;">0</div>
        </div>
        <div>
          <div class="lbl">라벨</div>
          <div class="field" style="width:100%; box-sizing:border-box; margin-top:5px;">작업대 120</div>
        </div>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:12px; background:var(--tint2);">
        <div style="font-size:12px; font-weight:700; color:var(--muted);">잠금</div>
        <div style="width:32px; height:18px; border-radius:99px; background:var(--line); position:relative;">
          <div style="width:14px; height:14px; border-radius:99px; background:#fff; position:absolute; left:2px; top:2px;"></div>
        </div>
      </div>

      <div style="display:flex; gap:8px;">
        <div class="btn btn-ghost" style="flex:1; justify-content:center;">앞으로</div>
        <div class="btn btn-ghost" style="flex:1; justify-content:center;">뒤로</div>
      </div>

      <div style="height:1px; background:var(--line);"></div>

      <div style="flex:1; min-height:0; display:flex; flex-direction:column; gap:6px; overflow:hidden;">
        <div class="lbl">버전 기록</div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:7px 10px; border-radius:10px; background:var(--tint);">
          <div style="font-size:12px; font-weight:800; color:var(--accent);">v4 · 현재</div>
          <div class="wf-num" style="font-size:10.5px; color:var(--accent);">방금 전</div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:7px 10px;">
          <div style="font-size:12px; color:var(--muted);">v3</div>
          <div class="wf-num" style="font-size:10.5px; color:var(--faint);">09.10</div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:7px 10px;">
          <div style="font-size:12px; color:var(--muted);">v2</div>
          <div class="wf-num" style="font-size:10.5px; color:var(--faint);">09.06</div>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
